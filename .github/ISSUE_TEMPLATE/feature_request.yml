name: Feature request
description: Suggest a new variant, hook, option or improvement to the engine.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem or use case
      description: What are you trying to build?
      placeholder: I want a chat message to fly into the trash icon when deleted.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work, ideally with the API you have in mind.
      render: tsx
      placeholder: "await dissolve({ preset: 'my-variant' });"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other variants, hooks or libraries you tried.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links, videos or apps that show the effect.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
