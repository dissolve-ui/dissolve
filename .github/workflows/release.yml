name: Release

# On a v* tag (for example v0.1.0): publishes react-native-dissolve to npm with provenance,
# mirrors it to GitHub Packages as @rs-4/react-native-dissolve, and creates the GitHub Release
# with the matching CHANGELOG section. Also runs by hand from the Actions tab (dry run by default).
#
# Maintainer setup (once): add an npm automation token as the repository secret NPM_TOKEN
# (Settings > Secrets and variables > Actions > New repository secret). GitHub Packages and the
# Release use the built in GITHUB_TOKEN. No secret lives in this repo.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  contents: write # GitHub Release
  packages: write # GitHub Packages mirror
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./packages/react-native-dissolve/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/react-native-dissolve version $version"
            exit 1
          fi

      - name: Build the package
        run: npm run build:package

      - name: Pack (dry run)
        working-directory: packages/react-native-dissolve
        run: npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry-run == false
        working-directory: packages/react-native-dissolve
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Mirror to GitHub Packages
        if: github.event_name == 'push' || inputs.dry-run == false
        working-directory: packages/react-native-dissolve
        run: |
          npm pkg set name=@rs-4/react-native-dissolve
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > .npmrc
          npm publish --ignore-scripts --registry https://npm.pkg.github.com
          rm .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Notes: the CHANGELOG section of this version, or Unreleased if it was not renamed yet.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk '/^## \[Unreleased\]/ { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          fi
          printf '\n\nnpm: https://www.npmjs.com/package/react-native-dissolve/v/%s\n' "$version" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
