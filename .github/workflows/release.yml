name: Release

# On a v* tag (for example v0.1.0): publishes dissolve-ui to npm with provenance,
# mirrors it to GitHub Packages as @dissolve-ui/dissolve-ui, and creates the GitHub Release
# with the matching CHANGELOG section. Also runs by hand from the Actions tab (dry run by default).
#
# Maintainer setup (once): add an npm automation token as the repository secret NPM_TOKEN
# (Settings > Secrets and variables > Actions > New repository secret). GitHub Packages and the
# Release use the built in GITHUB_TOKEN. No secret lives in this repo.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  contents: write # GitHub Release
  packages: write # GitHub Packages mirror
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Version checks
        id: version
        run: |
          version="$(node -p "require('./packages/dissolve-ui/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag for another version (an older release tagged after the fact) publishes nothing.
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::Tag $GITHUB_REF_NAME is not the package version ($version): nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # Already on npm (published by hand): skip npm, still mirror and release.
          if npm view "dissolve-ui@$version" version >/dev/null 2>&1; then
            echo "::notice::dissolve-ui@$version is already on npm."
            echo "on_npm=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the package
        if: steps.version.outputs.skip != 'true'
        run: npm run build:package

      - name: Pack (dry run)
        if: steps.version.outputs.skip != 'true'
        working-directory: packages/dissolve-ui
        run: npm pack --dry-run --ignore-scripts

      - name: Publish to npm
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.on_npm != 'true' && (github.event_name == 'push' || inputs.dry-run == false)
        working-directory: packages/dissolve-ui
        run: |
          # Without a token (versions are published by hand with 2FA), skip instead of failing the tag.
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN: publish dissolve-ui@${{ steps.version.outputs.version }} to npm by hand (2FA)."
            exit 0
          fi
          npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Mirror to GitHub Packages
        if: steps.version.outputs.skip != 'true' && (github.event_name == 'push' || inputs.dry-run == false)
        working-directory: packages/dissolve-ui
        run: |
          npm pkg set name=@dissolve-ui/dissolve-ui
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > .npmrc
          npm publish --ignore-scripts --registry https://npm.pkg.github.com
          rm .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Release
        if: steps.version.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Notes: the CHANGELOG section of this version, or Unreleased if it was not renamed yet.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk '/^## \[Unreleased\]/ { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          fi
          printf '\n\nnpm: https://www.npmjs.com/package/dissolve-ui/v/%s\n' "$version" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
